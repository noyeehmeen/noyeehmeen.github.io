name: Update blog sitemap and publish
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 23 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: blog-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch RSS and build static archive
        run: node build.mjs
      - name: Preserve accumulated posts
        run: |
          if ! git diff --quiet -- posts.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add posts.json
            git commit -m "Update public blog post archive"
            git push
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
